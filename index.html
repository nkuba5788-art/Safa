<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SzafaX</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      color:#111
    }
    header{
      background:#111;
      color:white;
      padding:16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:10
    }
    header h1{margin:0}
    button{
      border:0;
      border-radius:10px;
      padding:11px 15px;
      cursor:pointer;
      font-weight:bold
    }
    .container{
      max-width:1100px;
      margin:auto;
      padding:20px
    }
    .tools{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:20px
    }
    input,select{
      padding:12px;
      border:1px solid #ccc;
      border-radius:10px;
      background:white
    }
    #search{flex:1;min-width:200px}
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
      gap:18px
    }
    .card{
      background:white;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 4px 15px #0001
    }
    .card img{
      width:100%;
      height:240px;
      object-fit:cover;
      background:#ddd
    }
    .info{padding:14px}
    .price{
      font-size:20px;
      font-weight:bold
    }
    .empty{
      text-align:center;
      padding:60px 10px;
      color:#777
    }
    .modal{
      position:fixed;
      inset:0;
      background:#0008;
      display:none;
      align-items:center;
      justify-content:center;
      padding:15px;
      z-index:50
    }
    .box{
      background:white;
      width:min(600px,100%);
      max-height:90vh;
      overflow:auto;
      border-radius:18px;
      padding:20px
    }
    .row{
      display:flex;
      gap:10px
    }
    .row>*{flex:1}
    .field{margin:10px 0}
    .field label{
      display:block;
      margin-bottom:5px;
      font-weight:bold
    }
    .field input,.field select{
      width:100%
    }
    .order{
      border:1px solid #ddd;
      border-radius:14px;
      padding:14px;
      margin:10px 0
    }
    .status{
      display:inline-block;
      padding:6px 10px;
      border-radius:20px;
      background:#eee;
      font-size:13px
    }
    @media(max-width:600px){
      .row{flex-direction:column}
      .card img{height:220px}
    }
  </style>
</head>

<body>

<header>
  <h1>SzafaX 👕</h1>
  <div>
    <button onclick="openOrders()">📦 Zamówienia</button>
    <button onclick="openCart()">🛒 <span id="cartCount">0</span></button>
  </div>
</header>

<div class="container">

  <div class="tools">
    <input id="search" placeholder="Szukaj ubrań..." oninput="render()">

    <select id="category" onchange="render()">
      <option value="">Wszystkie</option>
      <option value="Koszulki">Koszulki</option>
      <option value="Bluzy">Bluzy</option>
      <option value="Spodnie">Spodnie</option>
      <option value="Kurtki">Kurtki</option>
      <option value="Buty">Buty</option>
      <option value="Inne">Inne</option>
    </select>

    <button onclick="openAdd()">➕ Dodaj ubranie</button>
  </div>

  <div id="products" class="grid"></div>

</div>

<!-- DODAWANIE PRODUKTU -->
<div id="addModal" class="modal">
  <div class="box">
    <h2>Dodaj ubranie</h2>

    <div class="field">
      <label>Nazwa</label>
      <input id="pName">
    </div>

    <div class="row">
      <div class="field">
        <label>Cena</label>
        <input id="pPrice" type="number" step="0.01">
      </div>

      <div class="field">
        <label>Rozmiar</label>
        <input id="pSize" placeholder="np. M">
      </div>
    </div>

    <div class="field">
      <label>Kategoria</label>
      <select id="pCategory">
        <option>Koszulki</option>
        <option>Bluzy</option>
        <option>Spodnie</option>
        <option>Kurtki</option>
        <option>Buty</option>
        <option>Inne</option>
      </select>
    </div>

    <div class="field">
      <label>Zdjęcie</label>
      <input id="pImage" type="file" accept="image/*">
    </div>

    <div class="field">
      <label>Opis</label>
      <input id="pDescription">
    </div>

    <button onclick="addProduct()">Dodaj</button>
    <button onclick="closeModal('addModal')">Anuluj</button>
  </div>
</div>

<!-- KOSZYK -->
<div id="cartModal" class="modal">
  <div class="box">
    <h2>🛒 Koszyk</h2>
    <div id="cart"></div>
    <button onclick="checkout()">Przejdź do zamówienia</button>
    <button onclick="closeModal('cartModal')">Zamknij</button>
  </div>
</div>

<!-- ZAMÓWIENIE -->
<div id="checkoutModal" class="modal">
  <div class="box">
    <h2>📦 Dane dostawy</h2>

    <div class="field">
      <label>Imię i nazwisko</label>
      <input id="buyer">
    </div>

    <div class="field">
      <label>E-mail</label>
      <input id="email" type="email">
    </div>

    <div class="field">
      <label>Telefon</label>
      <input id="phone">
    </div>

    <div class="field">
      <label>Miasto</label>
      <input id="city">
    </div>

    <div class="field">
      <label>Ulica</label>
      <input id="street">
    </div>

    <div class="row">
      <div class="field">
        <label>Kod pocztowy</label>
        <input id="zip">
      </div>

      <div class="field">
        <label>Numer mieszkania</label>
        <input id="flat">
      </div>
    </div>

    <div class="field">
      <label>Sposób dostawy</label>
      <select id="delivery">
        <option>InPost Paczkomat</option>
        <option>Kurier</option>
        <option>Odbiór osobisty</option>
      </select>
    </div>

    <button onclick="createOrder()">Złóż zamówienie</button>
    <button onclick="closeModal('checkoutModal')">Anuluj</button>
  </div>
</div>

<!-- ZAMÓWIENIA -->
<div id="ordersModal" class="modal">
  <div class="box">
    <h2>📦 Moje zamówienia</h2>
    <div id="orders"></div>
    <button onclick="closeModal('ordersModal')">Zamknij</button>
  </div>
</div>

<script>

let products =
  JSON.parse(localStorage.getItem("szafax_products") || "[]");

let cart =
  JSON.parse(localStorage.getItem("szafax_cart") || "[]");

let orders =
  JSON.parse(localStorage.getItem("szafax_orders") || "[]");

function save(){
  localStorage.setItem("szafax_products",JSON.stringify(products));
  localStorage.setItem("szafax_cart",JSON.stringify(cart));
  localStorage.setItem("szafax_orders",JSON.stringify(orders));
}

function openModal(id){
  document.getElementById(id).style.display="flex";
}

function closeModal(id){
  document.getElementById(id).style.display="none";
}

function openAdd(){
  openModal("addModal");
}

async function addProduct(){

  const file=document.getElementById("pImage").files[0];

  if(!file){
    alert("Dodaj zdjęcie");
    return;
  }

  const reader=new FileReader();

  reader.onload=()=>{

    products.push({
      id:Date.now(),
      name:document.getElementById("pName").value,
      price:Number(document.getElementById("pPrice").value),
      size:document.getElementById("pSize").value,
      category:document.getElementById("pCategory").value,
      description:document.getElementById("pDescription").value,
      image:reader.result
    });

    save();
    render();
    closeModal("addModal");
  };

  reader.readAsDataURL(file);
}

function render(){

  const search=
    document.getElementById("search").value.toLowerCase();

  const category=
    document.getElementById("category").value;

  const box=document.getElementById("products");

  const filtered=products.filter(p=>
    p.name.toLowerCase().includes(search) &&
    (!category || p.category===category)
  );

  if(!filtered.length){
    box.innerHTML='<div class="empty">Brak produktów 😭</div>';
    return;
  }

  box.innerHTML=filtered.map(p=>`

    <div class="card">

      <img src="${p.image}">

      <div class="info">

        <h3>${escapeHtml(p.name)}</h3>

        <p>${escapeHtml(p.category)} • rozmiar ${escapeHtml(p.size)}</p>

        <p>${escapeHtml(p.description || "")}</p>

        <div class="price">${p.price.toFixed(2)} zł</div>

        <br>

        <button onclick="addToCart(${p.id})">
          🛒 Dodaj do koszyka
        </button>

      </div>

    </div>

  `).join("");
}

function addToCart(id){

  const p=products.find(x=>x.id===id);

  if(!p)return;

  cart.push(p);

  save();

  updateCart();

  alert("Dodano do koszyka!");

}

function removeFromCart(index){

  cart.splice(index,1);

  save();

  renderCart();

  updateCart();

}

function updateCart(){

  document.getElementById("cartCount").textContent=cart.length;

}

function openCart(){

  renderCart();

  openModal("cartModal");

}

function renderCart(){

  const box=document.getElementById("cart");

  if(!cart.length){

    box.innerHTML="<p>Koszyk jest pusty.</p>";

    return;

  }

  let total=0;

  box.innerHTML=cart.map((p,i)=>{

    total+=p.price;

    return `
      <div class="order">
        <b>${escapeHtml(p.name)}</b>
        <br>
        ${p.price.toFixed(2)} zł
        <br><br>
        <button onclick="removeFromCart(${i})">Usuń</button>
      </div>
    `;

  }).join("")+

  `<h3>Razem: ${total.toFixed(2)} zł</h3>`;

}

function checkout(){

  if(!cart.length){

    alert("Koszyk jest pusty.");

    return;

  }

  closeModal("cartModal");

  openModal("checkoutModal");

}

function createOrder(){

  const buyer=document.getElementById("buyer").value.trim();
  const email=document.getElementById("email").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const city=document.getElementById("city").value.trim();
  const street=document.getElementById("street").value.trim();
  const zip=document.getElementById("zip").value.trim();
  const flat=document.getElementById("flat").value.trim();
  const delivery=document.getElementById("delivery").value;

  if(!buyer || !email || !phone || !city){

    alert("Uzupełnij wymagane dane.");

    return;

  }

  const total=
    cart.reduce((sum,p)=>sum+p.price,0);

  const order={

    id:"SZX-"+Math.floor(100000+Math.random()*900000),

    date:new Date().toLocaleString("pl-PL"),

    status:"Nowe",

    payment:"Oczekuje na płatność",

    total,

    items:cart.map(p=>({
      name:p.name,
      price:p.price,
      image:p.image
    })),

    delivery:{
      buyer,
      email,
      phone,
      city,
      street,
      zip,
      flat,
      method:delivery
    },

    shipment:{
      tracking:null,
      label:null,
      status:"Nie utworzono"
    }

  };

  orders.unshift(order);

  cart=[];

  save();

  updateCart();

  closeModal("checkoutModal");

  alert(
    "Zamówienie "+order.id+
    " zostało utworzone."
  );

  openOrders();

}

function openOrders(){

  renderOrders();

  openModal("ordersModal");

}

function renderOrders(){

  const box=document.getElementById("orders");

  if(!orders.length){

    box.innerHTML="<p>Nie masz jeszcze zamówień.</p>";

    return;

  }

  box.innerHTML=orders.map(o=>`

    <div class="order">

      <h3>${o.id}</h3>

      <span class="status">${escapeHtml(o.status)}</span>

      <p>📅 ${escapeHtml(o.date)}</p>

      <p>💰 ${o.total.toFixed(2)} zł</p>

      <p>💳 ${escapeHtml(o.payment)}</p>

      <p>🚚 ${escapeHtml(o.shipment.status)}</p>

      ${
        o.shipment.tracking
        ? `<p>📦 Numer przesyłki: <b>${escapeHtml(o.shipment.tracking)}</b></p>`
        : ""
      }

      <hr>

      <b>Dostawa</b>

      <p>
        ${escapeHtml(o.delivery.buyer)}<br>
        ${escapeHtml(o.delivery.city)}<br>
        ${escapeHtml(o.delivery.street || "")}
        ${escapeHtml(o.delivery.flat || "")}<br>
        ${escapeHtml(o.delivery.zip || "")}<br>
        ${escapeHtml(o.delivery.method)}
      </p>

    </div>

  `).join("");

}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

render();
updateCart();

</script>

</body>
  </html>
