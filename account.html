<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SzafaX | Konto</title>
</head>

<body>

<h1>SzafaX</h1>

<div id="login">
  <h2>Zaloguj się</h2>

  <input id="email" type="email" placeholder="E-mail">
  <input id="password" type="password" placeholder="Hasło">

  <button id="loginButton">Zaloguj się</button>

  <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://whghzllbfantputsvbvc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-ObakG7YMEesq-AoBSU1uQ_nfIc6Tf_;

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  alert("JS DZIAŁA");

document
  .getElementById("loginButton")
  .addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    if (!email || !password) {
      message.textContent =
        "Wpisz e-mail i hasło.";
      return;
    }

    message.textContent = "Logowanie...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      message.textContent =
        "Błąd: " + error.message;
      return;
    }

    message.textContent =
      "Zalogowano! 👋";

    console.log(data);
  });
</script>

</body>
</html>
